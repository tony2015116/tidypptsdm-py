name: build-exe

on:
  push:
    branches: [main]
  pull_request:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ".[exe]"
      - run: pyinstaller --noconfirm packaging/tidypptsdm.spec
      - name: Self-test of the desktop app (Tk window)
        shell: pwsh
        run: |
          $p = Start-Process -Wait -PassThru -FilePath "dist/tidypptsdm/tidypptsdm.exe" -ArgumentList "selftest", "--out", "selftest"
          $report = Get-Content selftest/tidypptsdm-selftest.txt
          ($report | Select-String "ERROR|MISSING|loaded from|started|window|tk.tcl") | ForEach-Object { Write-Output "::notice title=selftest::$_" }
          if ($p.ExitCode -ne 0) { Write-Output "::error title=selftest::the app window could not start"; exit 1 }
      - name: Self-test from a copy in another folder (as a user unzips it)
        shell: pwsh
        run: |
          Copy-Item -Recurse dist/tidypptsdm "$env:RUNNER_TEMP/unzipped/tidypptsdm"
          $env:TCL_LIBRARY = "C:/nonexistent/tcl8.6"   # a stale variable set by another program
          $env:TK_LIBRARY = "C:/nonexistent/tk8.6"
          $p = Start-Process -Wait -PassThru -FilePath "$env:RUNNER_TEMP/unzipped/tidypptsdm/tidypptsdm.exe" -ArgumentList "selftest", "--out", "selftest2"
          (Get-Content selftest2/tidypptsdm-selftest.txt | Select-String "ERROR|MISSING|loaded from|started|window") | ForEach-Object { Write-Output "::notice title=selftest-copy::$_" }
          if ($p.ExitCode -ne 0) { Write-Output "::error title=selftest-copy::the app window could not start"; exit 1 }
      - name: Smoke test (the windowed exe writes its messages to a log file)
        shell: pwsh
        run: |
          $exe = "dist/tidypptsdm/tidypptsdm.exe"
          Start-Process -Wait -FilePath $exe -ArgumentList "example", "smoke/ex"
          Start-Process -Wait -FilePath $exe -ArgumentList "run", "smoke/ex", "--out", "smoke/out", "--days", "7"
          Get-Content smoke/out/tidypptsdm.log
          if (-not (Test-Path smoke/out/2024-05-25/index.html)) { throw "no report" }
          if (-not (Test-Path smoke/out/2024-05-25/monitor.xlsx)) { throw "no workbook" }
      - name: Zip
        shell: pwsh
        run: |
          Copy-Item README.md, LICENSE dist/tidypptsdm/
          Compress-Archive -Path dist/tidypptsdm -DestinationPath tidypptsdm-windows.zip
      - name: Self-test of the zip as a user gets it
        shell: pwsh
        run: |
          Expand-Archive tidypptsdm-windows.zip -DestinationPath "$env:RUNNER_TEMP/fromzip"
          $p = Start-Process -Wait -PassThru -FilePath "$env:RUNNER_TEMP/fromzip/tidypptsdm/tidypptsdm.exe" -ArgumentList "selftest", "--out", "selftest3"
          $r = Get-Content selftest3/tidypptsdm-selftest.txt
          ($r | Select-String "ERROR|MISSING|loaded from|started|window") | ForEach-Object { Write-Output "::notice title=selftest-zip::$_" }
          if ($p.ExitCode -ne 0) { Write-Output "::error title=selftest-zip::the app window could not start"; exit 1 }
      - uses: actions/upload-artifact@v4
        with:
          name: tidypptsdm-windows
          path: tidypptsdm-windows.zip
      - name: Attach to the release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" tidypptsdm-windows.zip --clobber
